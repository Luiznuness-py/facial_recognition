[project]
name = "facial-recognition"
version = "0.1.0"
description = ""
authors = [
    {name = "Luiznuness",email = "lg.nunes.souza2006@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "argon2-cffi (>=23.1)",
    "cryptography (>=44)",
    "Pillow (>=11)",
    "torch (>=2.6)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.poetry.dependencies]
torch = {version = ">=2.6", source = "pytorch-cpu"}

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
